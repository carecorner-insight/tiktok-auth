<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareyBot — Judge Agreement</title>
  <style>
    /* ── CareyBot shared look (inlined on every internal tool page) ── */
    :root {
      color-scheme: light;
      --bg: #f3f6f5; --panel: #ffffff; --border: #dbe3e0; --border-strong: #c2cec9;
      --text: #24322c; --muted: #5d6d66;
      --accent: #2e7466; --accent-strong: #235a4f; --accent-soft: #e4efec;
      --user: #1d5fa8;
      --pass: #1a7f4b; --fail: #b42331; --warn: #8a5a00; --neutral: #5d6d66;
      --pass-bg: #dcefe4; --fail-bg: #f9dee1; --warn-bg: #f7ecd2; --neutral-bg: #e7ebe9;
      --zebra: #f7faf9;
      --shadow: 0 1px 2px rgba(30,45,40,.06), 0 1px 1px rgba(30,45,40,.04);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
    /* header */
    header { position: sticky; top: 0; z-index: 10; background: var(--panel);
      border-bottom: 1px solid var(--border); padding: 10px 20px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
    .brand-text h1 { font-size: 15px; margin: 0; font-weight: 650; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--muted); display: block; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px;
      font-size: 13px; border: 1px solid transparent; }
    .nav a:hover { background: var(--accent-soft); color: var(--accent-strong); }
    .nav a.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600;
      border-color: #c8ded8; }
    .spacer { margin-left: auto; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--border-strong);
      border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
    button:hover { border-color: var(--accent); color: var(--accent-strong); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
      border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 28px 0 14px; font-weight: 650; }
    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; }
    .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; box-shadow: var(--shadow); }
    .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .verdict { font-size: 12px; font-weight: 700; margin-top: 6px; }
    /* tables */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: var(--zebra); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .grid td, .grid th { text-align: center; }
    .grid td.rowhead, .grid th.rowhead { text-align: left; color: var(--muted); }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.good { background: var(--pass-bg); color: var(--pass); }
    .pill.borderline { background: var(--warn-bg); color: var(--warn); }
    .pill.bad { background: var(--fail-bg); color: var(--fail); }
    .pill.crit { background: var(--fail-bg); color: var(--fail); }
    .pill.pass { background: var(--pass-bg); color: var(--pass); }
    .pill.fail { background: var(--fail-bg); color: var(--fail); }
    .pill.na { background: var(--neutral-bg); color: var(--neutral); }
    td.diag { background: var(--fail-bg) !important; font-weight: 700; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; box-shadow: var(--shadow); }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.55; }
    .bar { height: 10px; border-radius: 5px; background: var(--neutral-bg); overflow: hidden; display: flex; }
    .bar span { display: block; height: 100%; }
    /* token gate */
    .gate { max-width: 420px; margin: 9vh auto 0; padding: 0 16px; }
    .gate-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 30px 28px; box-shadow: var(--shadow); text-align: center; }
    .gate-card .brand-mark { margin: 0 auto 12px; width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
    .gate-card h2 { border: none; color: var(--text); text-transform: none; letter-spacing: 0;
      font-size: 19px; margin: 0 0 6px; }
    .gate-card p { margin: 0 0 14px; }
    .gate-card input { width: 100%; margin: 4px 0 12px; padding: 11px 12px; background: var(--panel);
      color: var(--text); border: 1px solid var(--border-strong); border-radius: 8px; font-size: 14px; }
    .gate-card button { width: 100%; background: var(--accent); color: #fff; border: none;
      font-weight: 600; padding: 11px; font-size: 14px; border-radius: 8px; }
    .gate-card button:hover { background: var(--accent-strong); color: #fff; }
    .gate-err { color: var(--fail); min-height: 18px; font-size: 13px; margin: 10px 0 0; }
    .gate-hint { font-size: 12px; margin-top: 12px; }
    .hidden { display: none; }
    .reply { white-space: pre-wrap; word-break: break-word; max-width: 460px; min-width: 220px; }
    @media (max-width: 720px) {
      header { padding: 10px 14px; gap: 10px; }
      main { padding: 14px; }
      .gate { margin-top: 5vh; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="brand-mark" aria-hidden="true">C</div>
      <h2>Judge Agreement</h2>
      <p class="muted">Internal tool for Care Corner INSIGHT staff. Enter the access token to see how well the automated judge agrees with human reviewers.</p>
      <input id="tokenInput" type="password" placeholder="Access token" autocomplete="off" />
      <button id="tokenBtn">View dashboard</button>
      <p id="gateErr" class="gate-err"></p>
      <p class="gate-hint muted">Don't have a token? Ask the CareyBot project team.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div class="brand-text">
          <h1>Judge Agreement</h1>
          <span class="brand-sub">CareyBot · Care Corner INSIGHT</span>
        </div>
      </div>
      <nav class="nav">
        <a id="navLog" href="#">Live Log</a>
        <a id="navEval" href="#">Evals</a>
        <a id="navReview" href="#">Review</a>
        <a class="active" href="#">Agreement</a>
      </nav>
      <div class="spacer"></div>
      <span id="status" class="muted"></span>
      <button id="csvBtn">Export CSV</button>
      <button id="refreshBtn">Refresh</button>
    </header>
    <main id="main"><p class="muted">Loading…</p></main>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get('token') || '';

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      function el(id) { return document.getElementById(id); }
      function num(v, suffix) { return v === null || v === undefined ? '—' : v + (suffix || ''); }

      // Landis & Koch benchmarks — the standard reading of kappa.
      function kappaVerdict(k) {
        if (k === null || k === undefined) return { text: 'not enough data', color: 'var(--muted)' };
        if (k < 0.2)  return { text: 'poor — do not auto-label', color: 'var(--fail)' };
        if (k < 0.41) return { text: 'fair — not usable yet', color: 'var(--fail)' };
        if (k < 0.61) return { text: 'moderate — keep reviewing', color: 'var(--warn)' };
        if (k < 0.81) return { text: 'substantial — usable with spot checks', color: 'var(--pass)' };
        return { text: 'near-perfect', color: 'var(--pass)' };
      }

      function render(d) {
        var r = d.report, t = r.totals, o = r.overall;
        var kv = kappaVerdict(o.kappa);

        var kpis = [
          { label: "Cohen's κ (overall)", value: num(o.kappa), sub: 'n = ' + o.n,
            verdict: kv.text, color: kv.color },
          { label: 'Raw agreement', value: num(o.agreementPct, '%'),
            sub: 'κ is the number that matters' },
          { label: 'Labels', value: t.labels, sub: t.uniqueReplies + ' replies · ' + t.labelers + ' reviewer(s)' },
          { label: 'Corpus reviewed', value: (d.corpusSize ? Math.round(t.uniqueReplies / d.corpusSize * 100) : 0) + '%',
            sub: t.uniqueReplies + ' of ' + d.corpusSize },
          { label: 'Inter-rater κ', value: num(r.interRater.kappa),
            sub: r.interRater.comparisons + ' overlapping comparison(s)' },
        ];

        var kpiHtml = kpis.map(function (k) {
          return '<div class="kpi"><div class="label">' + k.label + '</div>' +
            '<div class="value">' + k.value + '</div>' +
            '<div class="sub">' + esc(k.sub) + '</div>' +
            (k.verdict ? '<div class="verdict" style="color:' + k.color + '">' + esc(k.verdict) + '</div>' : '') +
          '</div>';
        }).join('');

        // ── confusion matrix ──
        var cats = o.categories;
        var mHead = '<tr><th class="rowhead">human ↓ / judge →</th>' +
          cats.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th>total</th></tr>';
        var mBody = cats.map(function (c, i) {
          var row = o.matrix[i] || [];
          var tot = row.reduce(function (a, b) { return a + b; }, 0);
          return '<tr><td class="rowhead"><span class="pill ' + esc(c) + '">' + esc(c) + '</span></td>' +
            row.map(function (v, j) {
              return '<td class="' + (i === j ? '' : (v ? 'diag' : '')) + '">' + v + '</td>';
            }).join('') + '<td class="muted">' + tot + '</td></tr>';
        }).join('');

        // ── bias bar ──
        var b = r.bias, bTot = b.tooLenient + b.tooStrict + b.exact;
        var barHtml = bTot ? '<div class="bar">' +
          '<span style="width:' + (b.tooLenient / bTot * 100) + '%;background:var(--fail)"></span>' +
          '<span style="width:' + (b.exact / bTot * 100) + '%;background:var(--pass)"></span>' +
          '<span style="width:' + (b.tooStrict / bTot * 100) + '%;background:var(--warn)"></span>' +
          '</div><p class="note">' +
          '<b style="color:var(--fail)">' + b.tooLenient + '</b> too lenient (judge rated better than the human) · ' +
          '<b style="color:var(--pass)">' + b.exact + '</b> exact · ' +
          '<b style="color:var(--warn)">' + b.tooStrict + '</b> too strict. ' +
          'Leniency is the dangerous direction — it means the judge waves through replies a human would reject.</p>'
          : '<p class="muted">No judged labels yet.</p>';

        // ── per-dimension ──
        var dimRows = r.dimensions.map(function (dim) {
          var v = kappaVerdict(dim.kappa);
          return '<tr><td>' + esc(dim.label) + (dim.critical ? ' <span class="pill crit">critical</span>' : '') + '</td>' +
            '<td class="mono">' + num(dim.kappa) + '</td>' +
            '<td>' + num(dim.agreementPct, '%') + '</td>' +
            '<td style="color:' + v.color + '">' + esc(v.text) + '</td>' +
            '<td class="muted">' + dim.n + '</td></tr>';
        }).join('');

        // ── per judge version ──
        var verRows = r.byVersion.length ? r.byVersion.map(function (v) {
          return '<tr><td class="mono">' + esc(v.version) + '</td><td class="mono">' + num(v.kappa) + '</td>' +
            '<td>' + num(v.agreementPct, '%') + '</td><td class="muted">' + v.n + '</td></tr>';
        }).join('') : '<tr><td colspan="4" class="muted">No judged labels yet.</td></tr>';

        function disagreementTable(rows, emptyMsg) {
          if (!rows.length) return '<p class="muted">' + emptyMsg + '</p>';
          return '<div class="table-wrap"><table><tr><th>Reply</th><th>Human</th><th>Judge</th><th>Why (human)</th><th>Reviewer</th></tr>' +
            rows.map(function (x) {
              return '<tr><td class="reply">' + esc((x.replyText || '').slice(0, 220)) +
                  '<div class="muted mono" style="font-size:11px">' + esc(x.persona || '') +
                  (x.phase ? ' · ' + esc(x.phase) : '') + '</div></td>' +
                '<td><span class="pill ' + esc(x.human.overall) + '">' + esc(x.human.overall) + '</span></td>' +
                '<td>' + (x.llm ? '<span class="pill ' + esc(x.llm.overall) + '">' + esc(x.llm.overall) + '</span>' : '—') + '</td>' +
                '<td class="muted">' + esc(x.rationale || '') + '</td>' +
                '<td class="muted">' + esc(x.labelerName || '') + '</td></tr>';
            }).join('') + '</table></div>';
        }

        el('main').innerHTML =
          '<div class="kpis">' + kpiHtml + '</div>' +
          '<div class="card note" style="margin-top:16px">' +
            '<b>How to read this:</b> raw agreement is inflated when most replies land in one category — ' +
            'a judge that always says “good” can score 80% agreement and still be useless. Cohen\'s κ corrects ' +
            'for that. Do not let the judge label unreviewed data below κ ≈ 0.6, and never on the ' +
            '<b>safety</b> dimension.' +
          '</div>' +

          '<h2>Overall verdict — human vs judge</h2>' +
          '<div class="table-wrap"><table class="grid">' + mHead + mBody + '</table></div>' +
          '<p class="note">Off-diagonal cells are disagreements. The top-right corner (human said <b>bad</b>, ' +
          'judge said <b>good</b>) is the cell to watch.</p>' +

          '<h2>Judge bias direction</h2>' + barHtml +

          '<h2>Per-dimension agreement</h2>' +
          '<div class="table-wrap"><table><tr><th>Dimension</th><th>κ</th><th>Agreement</th><th>Reading</th><th>n</th></tr>' + dimRows + '</table></div>' +

          '<h2>Judge accuracy by prompt version</h2>' +
          '<div class="table-wrap"><table><tr><th>Version</th><th>κ</th><th>Agreement</th><th>n</th></tr>' + verRows + '</table></div>' +
          '<p class="note">Bump <span class="mono">JUDGE_VERSION</span> whenever the rubric changes, so this ' +
          'table shows whether a prompt edit actually improved the judge.</p>' +

          '<h2>⚠ Critical misses <span class="muted" style="text-transform:none;font-weight:400">' +
            '(judge passed a safety/boundaries check a human failed)</span></h2>' +
          disagreementTable(r.criticalMisses, 'None — no critical dimension was passed by the judge and failed by a human.') +

          '<h2>All disagreements <span class="muted" style="text-transform:none;font-weight:400">' +
            '(newest first — this is your few-shot material)</span></h2>' +
          disagreementTable(r.disagreements, 'No disagreements recorded yet.');

        el('status').textContent = t.labels + ' labels · ' + t.labelers + ' reviewer(s)';
      }

      function load() {
        el('status').textContent = 'loading…';
        fetch('/api/label-stats?token=' + encodeURIComponent(token), { cache: 'no-store' })
          .then(function (r) {
            if (r.status === 401) throw new Error('unauthorized');
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
          })
          .then(render)
          .catch(function (e) {
            if (e.message === 'unauthorized') { showGate('Invalid or expired token.'); return; }
            el('status').textContent = 'error: ' + e.message;
          });
      }

      function start() {
        el('app').classList.remove('hidden'); el('gate').classList.add('hidden');
        var q = '?token=' + encodeURIComponent(token);
        el('navLog').href = 'uat-logs.html' + q;
        el('navEval').href = 'eval-dashboard.html' + q;
        el('navReview').href = 'label.html';
        el('refreshBtn').addEventListener('click', load);
        el('csvBtn').addEventListener('click', function () {
          window.open('/api/labels?format=csv&token=' + encodeURIComponent(token), '_blank');
        });
        load();
      }

      function showGate(msg) {
        el('gate').classList.remove('hidden'); el('app').classList.add('hidden');
        el('gateErr').textContent = msg || '';
        el('tokenBtn').onclick = function () {
          token = el('tokenInput').value.trim();
          if (token) { history.replaceState(null, '', '?token=' + encodeURIComponent(token)); start(); }
        };
        el('tokenInput').addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') el('tokenBtn').click();
        });
      }

      if (token) start(); else showGate('');
    })();
  </script>
</body>
</html>
