name: CareyBot Eval

on:
  schedule:
    # 00:00 UTC every other day (GitHub may delay a few minutes under load)
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      menu_modes:
        description: 'Entry UX(es) to evaluate (comma-separated: intent, numbered)'
        required: false
        default: 'intent,numbered'

jobs:
  eval:
    runs-on: ubuntu-latest
    # Both modes run sequentially (personas × 2), so allow ~2× the single-mode time.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install` (not `npm ci`) — the committed lockfile was normalized by a
      # newer npm and npm 10.x flags it as out-of-sync under `npm ci` (EUSAGE).
      # install is lenient and reconciles instead of failing.
      - run: npm install --no-audit --no-fund

      - name: Run evaluation harness
        run: npx ts-node src/scripts/run-eval.ts
        env:
          SIM_BASE_URL: ${{ secrets.SIM_BASE_URL }}
          SIM_TOKEN: ${{ secrets.SIM_TOKEN }}
          # Roleplay "youth" runs on Qwen (DashScope) — cheaper than OpenAI.
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          EVAL_ROLEPLAY_MODEL: ${{ vars.EVAL_ROLEPLAY_MODEL }}
          # Scheduled runs evaluate both modes; manual runs can override.
          EVAL_MENU_MODES: ${{ github.event.inputs.menu_modes || 'intent,numbered' }}
